      <path d="M164 1424 C134 1398 113 1361 105 1315 C131 1326 157 1348 182 1378 Z" fill="url(#lampRed)" stroke="#111827" stroke-width="2.3"/>
      <path d="M176 1407 C152 1381 133 1362 113 1349" stroke="#FCA5A5" stroke-width="1.9" opacity="0.72"/>
    </g>

    <g id="leftSeat">
