<svg xmlns="http://www.w3.org/2000/svg"
     xmlns:xlink="http://www.w3.org/1999/xlink"
     xmlns:inkscape="http://www.inkscape.org/namespaces/inkscape"
     width="820" height="2420" viewBox="0 0 820 2420" role="img" aria-labelledby="title desc">
  <title id="title">Editable realistic vector top-view convertible profile</title>
  <desc id="desc">High-detail editable vector top-view open convertible vehicle with PROFILE HPC at the front, Education ZONE in the center, Awards ZONE at the rear, connected by SOME/IP labels, with long fading tyre traces continuing behind the vehicle.</desc>

  <defs>
    <filter id="carShadow" x="-20%" y="-10%" width="140%" height="130%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#C8D2DF" flood-opacity="0.50"/>
    </filter>
    <filter id="cardShadow" x="-25%" y="-25%" width="150%" height="150%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#D0D7E2" flood-opacity="0.55"/>
    </filter>

    <linearGradient id="bodyPaint" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="45%" stop-color="#FAFBFD"/>
      <stop offset="100%" stop-color="#EEF2F6"/>
    </linearGradient>
    <linearGradient id="sideTone" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#E9EEF4"/>
      <stop offset="50%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#E9EEF4"/>
    </linearGradient>
    <linearGradient id="glassMain" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#64748B"/>
      <stop offset="100%" stop-color="#2B3440"/>
    </linearGradient>
    <linearGradient id="glassHighlight" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#D6E3F3" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#D6E3F3" stop-opacity="0.05"/>
    </linearGradient>
    <linearGradient id="interiorMain" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#101722"/>
      <stop offset="100%" stop-color="#060B12"/>
    </linearGradient>
    <linearGradient id="seatFill" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FAF8F3"/>
      <stop offset="100%" stop-color="#DDDAD4"/>
    </linearGradient>
    <linearGradient id="seatSide" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#D6D3CE"/>
      <stop offset="100%" stop-color="#FBFAF7"/>
    </linearGradient>
    <linearGradient id="lampRed" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#2B0000"/>
      <stop offset="40%" stop-color="#D03434"/>
      <stop offset="65%" stop-color="#FF7272"/>
      <stop offset="100%" stop-color="#2B0000"/>
    </linearGradient>
    <linearGradient id="lampClear" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#CBD5E1"/>
    </linearGradient>
    <radialGradient id="cockpitShade" cx="50%" cy="42%" r="70%">
      <stop offset="0%" stop-color="#0f172a" stop-opacity="0.40"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="trackFade" x1="0" y1="1500" x2="0" y2="2400" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#6B7280" stop-opacity="0.38"/>
      <stop offset="45%" stop-color="#9CA3AF" stop-opacity="0.23"/>
      <stop offset="100%" stop-color="#CBD5E1" stop-opacity="0.04"/>
    </linearGradient>
    <linearGradient id="wakeFade" x1="0" y1="1500" x2="0" y2="2380" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#CBD5E1" stop-opacity="0.34"/>
      <stop offset="100%" stop-color="#E5E7EB" stop-opacity="0.02"/>
    </linearGradient>

    <g id="leftMirror" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <path d="M128 560 C98 541 72 538 55 548 C43 557 43 573 55 585 L81 607 C95 617 111 617 126 608 L149 594" fill="#FCFCFD" stroke="#111827" stroke-width="2.2"/>
