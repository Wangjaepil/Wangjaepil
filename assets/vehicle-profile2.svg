    <path d="M410 1535 L410 2370" stroke="url(#wakeFade)" stroke-width="2" stroke-dasharray="22 34"/>
    <path d="M490 1550 C483 1810 474 2075 464 2350" stroke="url(#wakeFade)" stroke-width="2.5" stroke-dasharray="18 30"/>
  </g>

