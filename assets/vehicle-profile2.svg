      <path d="M245 750 C252 726 256 696 256 656 C256 617 252 591 245 580" fill="none" stroke="#FFFFFF" stroke-width="2" opacity="0.38"/>
      <path d="M252 615 C266 605 282 601 298 603 C312 604 324 610 332 619" fill="none" stroke="#D1D5DB" stroke-width="2.1"/>
      <path d="M252 649 C266 639 282 635 298 637 C312 638 324 644 332 653" fill="none" stroke="#D1D5DB" stroke-width="2.1"/>
      <path d="M252 683 C266 673 282 669 298 671 C312 672 324 678 332 687" fill="none" stroke="#D1D5DB" stroke-width="2.1"/>
