      <path d="M147 592 L132 598" stroke="#7A8492" stroke-width="1.7"/>
    </g>

    <g id="leftHeadlamp" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <path d="M160 182 C131 214 112 251 105 297 C132 288 156 268 180 231 Z" fill="url(#lampClear)" stroke="#111827" stroke-width="2.3"/>
      <path d="M146 201 C131 220 121 239 115 262 C131 253 145 240 158 221 Z" fill="#0F172A" opacity="0.24"/>
      <ellipse cx="143" cy="247" rx="18" ry="31" fill="#0F172A" opacity="0.70"/>
      <ellipse cx="143" cy="248" rx="10" ry="17" fill="#101828"/>
