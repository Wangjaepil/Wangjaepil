    <path d="M660 1495 C660 1715 646 1965 622 2380" stroke="url(#trackFade)" stroke-width="14" stroke-dasharray="34 22"/>
    <path d="M618 1498 C617 1718 605 1970 584 2382" stroke="url(#trackFade)" stroke-width="9" stroke-dasharray="28 25"/>
    <path d="M675 1500 C674 1735 659 1990 636 2390" stroke="url(#wakeFade)" stroke-width="3"/>
    <path d="M601 1500 C600 1735 588 1990 569 2390" stroke="url(#wakeFade)" stroke-width="2.5"/>

