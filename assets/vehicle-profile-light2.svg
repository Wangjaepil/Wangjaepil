<svg xmlns="http://www.w3.org/2000/svg" width="430" height="980" viewBox="0 0 430 980" role="img" aria-labelledby="title desc">
<title id="title">Top-view vehicle profile architecture</title>
<desc id="desc">Detailed top-view sedan silhouette with Profile HPC, Education ZONE, and Awards ZONE / Activities connected by a centered SOME/IP backbone.</desc>
<defs>
  <filter id="cardShadow" x="-20%" y="-20%" width="140%" height="140%">
    <feDropShadow dx="0" dy="6" stdDeviation="7" flood-color="#E5E7EB" flood-opacity="0.55"/>
  </filter>
  <linearGradient id="bodyGrad" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0%" stop-color="#F7F8FA"/>
    <stop offset="100%" stop-color="#F7F8FA"/>
  </linearGradient>
  <linearGradient id="glassGrad" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0%" stop-color="#C8D6E8"/>
    <stop offset="100%" stop-color="#B8C8DC"/>
  </linearGradient>
</defs>

<rect width="430" height="980" rx="24" fill="#FFFFFF"/>
<rect x="1.5" y="1.5" width="427" height="977" rx="22.5" fill="none" stroke="#E5E7EB" stroke-width="2"/>

