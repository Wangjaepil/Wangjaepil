<svg xmlns="http://www.w3.org/2000/svg" width="380" height="760" viewBox="0 0 380 760" role="img" aria-labelledby="title desc">
<title id="title">Top-view vehicle profile architecture</title>
<desc id="desc">A top-view car containing Profile HPC, Education Zone, and Awards Zone connected vertically through SOME/IP.</desc>

<rect width="380" height="760" rx="24" fill="#FFFFFF"/>
<rect x="1.5" y="1.5" width="377" height="757" rx="22.5" fill="none" stroke="#E5E7EB" stroke-width="2"/>

<!-- Top-view car silhouette -->
<g fill="none" stroke="#9CA3AF" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
